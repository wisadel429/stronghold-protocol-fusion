<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>正在进入服务器 · 卫戍协议：盟约</title>
<style>
  :root { --green:#35d07f; --green2:#7bf0b0; --dim:#7f9488; --red:#e05a4f; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background: radial-gradient(900px 480px at 50% 42%, #10241a 0%, #070b09 62%);
    color:#e8f2ea; font:14px/1.6 "Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px; overflow:hidden;
  }
  .ring { position:relative; width:86px; height:86px; margin-bottom:28px; }
  .ring i { position:absolute; inset:0; border-radius:50%; border:2px solid transparent; border-top-color:var(--green); animation:spin 1.15s linear infinite; }
  .ring i:nth-child(2){ inset:10px; border-top-color:rgba(123,240,176,.55); animation-duration:1.7s; animation-direction:reverse; }
  .ring i:nth-child(3){ inset:20px; border-top-color:rgba(216,169,74,.45); animation-duration:2.3s; }
  @keyframes spin { to { transform:rotate(360deg); } }
  h1 { margin:0 0 10px; font-size:28px; letter-spacing:.1em; font-weight:800; }
  .step { margin:0 0 8px; color:var(--green2); font-size:14px; letter-spacing:.05em; min-height:22px; }
  .addr { color:var(--dim); font:12px Consolas,monospace; margin-bottom:24px; word-break:break-all; max-width:70vw; }
  .bar { width:min(480px,70vw); height:4px; border-radius:2px; background:#131c16; overflow:hidden; }
  .bar i { display:block; height:100%; width:8%; background:linear-gradient(90deg,#1f7a4a,var(--green)); transition:width .4s; }
  .meta { width:min(480px,70vw); margin-top:14px; display:flex; justify-content:space-between; color:var(--dim); font-size:12px; }
  .back { margin-top:30px; padding:8px 18px; border-radius:4px; border:1px solid #2c6b47; background:#123322; color:var(--green2); cursor:pointer; font:inherit; }
  .back:hover { background:#17452c; }
  .err { color:var(--red); }
</style>
</head>
<body>
  <div class="ring"><i></i><i></i><i></i></div>
  <h1 id="title">正在进入服务器</h1>
  <p class="step" id="step">正在解析地址…</p>
  <div class="addr" id="addr"></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="meta"><span id="time">0.0s</span><span>连接成功后会自动进入游戏</span></div>
  <button class="back" id="back">返回启动页</button>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var to = q.get('to') || '';
  var label = q.get('label') || '正在进入服务器';
  var title = document.getElementById('title');
  var step = document.getElementById('step');
  var addr = document.getElementById('addr');
  var bar = document.getElementById('bar');
  var time = document.getElementById('time');
  var back = document.getElementById('back');
  title.textContent = label;
  document.title = label + ' · 卫戍协议：盟约';

  var t0 = performance.now();
  var timer = setInterval(function () {
    var s = (performance.now() - t0) / 1000;
    time.textContent = s.toFixed(1) + 's';
    bar.style.width = Math.min(92, 8 + s * 18) + '%';
    if (s > 3 && s < 3.2) step.textContent = '服务器响应较慢，仍在连接…';
    if (s > 10) step.textContent = '还没有响应，可以点下方“返回启动页”重试';
  }, 100);

  back.addEventListener('click', function () {
    try { location.replace('https://app.local/index.html'); } catch (e) { }
  });

  var url = null;
  try { url = to ? new URL(to) : null; } catch (e) { url = null; }
  if (!url || (url.protocol !== 'http:' && url.protocol !== 'https:')) {
    clearInterval(timer);
    step.textContent = '地址无效，无法进入';
    step.className = 'step err';
    bar.style.width = '100%';
    return;
  }
  // 业主 2026-11-21「邀请粘贴适配」：启动页识别到的邀请房间号存在 app.local 的 localStorage 里，
  // 这里把它拼进要跳转的服务器地址（?room=CODE），进游戏后自动加入该房间；用完即清，避免下次误进。
  try {
    var pendingRoom = localStorage.getItem('sp.launcher.room');
    if (pendingRoom && /^[A-Za-z0-9]{4,6}$/.test(pendingRoom) && !url.searchParams.get('room')) {
      url.searchParams.set('room', pendingRoom);
      localStorage.removeItem('sp.launcher.room');
      step.textContent = '正在进入房间 ' + pendingRoom + ' …';
    }
  } catch (e) { /* 隐私模式等读不到 localStorage 时忽略 */ }
  addr.textContent = url.toString();
  step.textContent = '正在连接 ' + url.host + ' …';
  bar.style.width = '18%';
  setTimeout(function () {
    step.textContent = '正在载入服务器页面…';
    bar.style.width = '55%';
    location.replace(url.toString());
  }, 1200);
})();
</script>
</body>
</html>
